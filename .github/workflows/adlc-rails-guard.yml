name: ADLC Rails Guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  rails-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned ADLC CLI
        run: npm install --global --ignore-scripts @adlc/cli@1.12.0

      - name: Fetch trusted base ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Verify ADLC bootstrap acknowledgement
        env:
          BASE_REF: ${{ github.base_ref }}
          ADLC_RUNNER_PATH: ${{ secrets.ADLC_RUNNER_PATH }}
          ADLC_SIGNED_RUNNER_POOL: ${{ vars.ADLC_SIGNED_RUNNER_POOL }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: adlc rails-guard-ci bootstrap

      - name: Enforce frozen ADLC rails
        env:
          BASE_REF: ${{ github.base_ref }}
        run: adlc rails-guard-ci

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zenval
      POSTGRES_USER: zenval
      POSTGRES_PASSWORD: zenval
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenval -d zenval"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zenval-postgres:/var/lib/postgresql/data

volumes:
  zenval-postgres:
